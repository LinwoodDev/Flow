name: Flutter build

on:
  push:
    branches:
      - "*"
    tags:
      - stable
      - nightly
  release:
    types: [published]
  pull_request:
jobs:
  build-apk:
    concurrency: ci-${{ github.ref }}
    defaults:
      run:
        working-directory: app
    runs-on: ubuntu-24.04
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v4
      - name: 🔧 Setup java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2.20.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: 📦 Get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
      - name: Import files
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          cd android
          if [[ -n "$KEY_PROPERTIES" ]] ; then echo "$KEY_PROPERTIES" | base64 --decode > key.properties  ; fi
          if [[ -n "$KEY_JKS" ]] ; then echo "$KEY_JKS" | base64 --decode > key.jks  ; fi
      #- run: flutter test
      - name: 🏭 Build nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --flavor nightly --dart-define=flavor=nightly
          cp build/app/outputs/flutter-apk/app-nightly-release.apk linwood-flow-android.apk
      - name: 🏭 Build production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --flavor production
          cp build/app/outputs/flutter-apk/app-production-release.apk linwood-flow-android.apk
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: app/linwood-flow-android.apk
      - name: 🏭 Build architecture nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor nightly --dart-define=flavor=nightly
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-nightly-release.apk linwood-flow-android-arm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-nightly-release.apk linwood-flow-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-nightly-release.apk linwood-flow-android-x86_64.apk
      - name: 🏭 Build architecture production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor production
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk linwood-flow-android-arm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk linwood-flow-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-production-release.apk linwood-flow-android-x86_64.apk
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm-build
          path: app/linwood-flow-android-arm.apk
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-build
          path: app/linwood-flow-android-arm64.apk
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-build
          path: app/linwood-flow-android-x86_64.apk
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v4
      - name: Make yq tool available on Windows runners
        run: |
          choco install yq
          choco install innosetup
      - uses: subosito/flutter-action@v2.20.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: ✅ Enable platforms
        run: flutter config --enable-windows-desktop
      - name: 📦 Get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
      - name: 🏭 Build nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter doctor -v
          flutter build windows -v --release --dart-define=flavor=nightly
      - name: 🏭 Build production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter doctor -v
          flutter build windows -v --release --dart-define=flavor=production
      - name: Build setup
        shell: pwsh
        run: |
          Get-Content pubspec.yaml | Select-String -Pattern 'version:\s(.+)\+'  | % {Set-Item -Path Env:FLOW_VERSION -Value "$($_.matches.groups[1])"}
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /DMyAppVersion=$Env:FLOW_VERSION FlowSetup.iss
        # flutter pub run msix:create
      - name: Copy portable start script
        run: |
          cp scripts/start.bat build/windows/x64/runner/Release/
          cp build/windows/x64/linwood-flow-windows-setup.exe linwood-flow-windows-setup-x86_64.exe
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            app/build/windows/x64/runner/Release/**
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            app/linwood-flow-windows-setup-x86_64.exe
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: ubuntu-24.04
            name: x86_64
            dir: x64
          - image: ubuntu-24.04-arm
            name: arm64
            dir: arm64
    runs-on: ${{ matrix.arch.image }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v4
      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip \
            python3-setuptools \
            desktop-file-utils \
            libgdk-pixbuf2.0-dev \
            fakeroot \
            strace \
            fuse \
            libgtk-3-dev \
            libx11-dev \
            pkg-config \
            cmake \
            ninja-build \
            libblkid-dev \
            liblzma-dev \
            clang \
            dpkg-dev \
            patchelf \
            alien \
            libsecret-1-dev \
            libjsoncpp-dev \
            rpm
      - uses: subosito/flutter-action@v2.20.0
        with:
          flutter-version-file: app/pubspec.yaml
          channel: 'master'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'
      - name: ✅ Enable platforms
        run: |
          rm -f "$(dirname "$(dirname "$(command -v flutter)")")/engine/src/.gn"
          flutter config --enable-linux-desktop
      - name: 📦 Get dependencies
        run: |
          flutter clean
          flutter doctor -v
          flutter pub get
      - name: 🏭 Build nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter doctor -v
          flutter build linux -v --release --dart-define=flavor=nightly
      - name: 🏭 Build production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter doctor -v
          flutter build linux -v --release --dart-define=flavor=production
      - name: 🏭 Make binary executable
        run: |
          chmod +x build/linux/${{ matrix.arch.dir }}/release/bundle/flow
      - name: Update files to arm64
        if: ${{ matrix.arch.name == 'arm64' }}
        run: |
          sed -i 's/^Architecture: amd64/Architecture: arm64/' linux/debian/DEBIAN/control
      - name: Build .deb executable
        run: |
          cp -fr build/linux/${{ matrix.arch.dir }}/release/bundle linux/debian/usr/bin
          dpkg-deb --build --root-owner-group linux/debian
          cp linux/*.deb linwood-flow-linux-${{ matrix.arch.name }}.deb
      - name: Build .rpm executable
        run: |
          bash scripts/build-rpm.sh -d ${{ matrix.arch.dir }} -b ${{ matrix.arch.name }}
      - name: Build .AppImage executable
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          wget -O appimage-builder.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder.AppImage
          sudo mv appimage-builder.AppImage /usr/local/bin/appimage-builder
          appimage-builder --recipe AppImageBuilder.yml --skip-test
      - name: Copy nessessary files
        run: |
          cp images/logo.svg build/linux/${{ matrix.arch.dir }}/release/bundle/dev.linwood.flow.svg
          mkdir -p build/linux/${{ matrix.arch.dir }}/release/bundle/usr/share
          cp -r linux/debian/usr/share build/linux/${{ matrix.arch.dir }}/release/bundle/usr
      - name: Rename AppImage
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          ls
          mv ./*.AppImage linwood-flow-linux-${{ matrix.arch.name }}.AppImage
      - name: Copy portable start script
        run: |
          chmod +x scripts/start.sh
          cp scripts/start.sh build/linux/${{ matrix.arch.dir }}/release/bundle
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch.name }}-build
          path: |
            app/build/linux/${{ matrix.arch.dir }}/release/bundle/**
      - name: Archive .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch.name }}-deb
          path: |
            app/linwood-flow-linux-${{ matrix.arch.name }}.deb
      - name: Archive .rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch.name }}-rpm
          path: |
            app/build/linwood-flow-linux-${{ matrix.arch.name }}.rpm
      - name: Archive .AppImage
        uses: actions/upload-artifact@v4
        if: ${{ matrix.arch.name == 'x86_64' }}
        with:
          name: linux-x86_64-appimage
          path: |
            app/linwood-flow-linux-x86_64.AppImage
  build-flatpak:
