name: Flutter build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - stable
      - nightly
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

env:
  # The release tag determines branding even if GitHub's prerelease flag is wrong.
  # main is the stable development branch; develop and PRs use nightly branding.
  BUILD_FLAVOR: >-
    ${{ (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/tags/stable' ||
         (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        && 'production' || 'nightly' }}
  TZ: UTC

jobs:
  build-apk:
    defaults:
      run:
        working-directory: app
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: 🔧 Setup java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/android/pub-cache
      - name: 📦 Get helper dependencies
        run: |
          dart pub get -C ../tools --enforce-lockfile
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.offline-build/android/gradle" >> "$GITHUB_ENV"
      - name: Import files
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          cd android
          if [[ -n "$KEY_PROPERTIES" ]] ; then echo "$KEY_PROPERTIES" | base64 --decode > key.properties  ; fi
          if [[ -n "$KEY_JKS" ]] ; then echo "$KEY_JKS" | base64 --decode > key.jks  ; fi
      #- run: flutter test
      - name: 🏭 Build and prepare offline Android dependencies
        run: |
          dart ../tools/build_offline.dart prepare --platform android --flavor "$BUILD_FLAVOR"
          cp "build/app/outputs/flutter-apk/app-$BUILD_FLAVOR-release.apk" linwood-flow-android.apk
      - name: 🏭 Build legacy packaging without network access
        env:
          USE_LEGACY_PACKAGING: "true"
        run: |
          sudo --preserve-env=ANDROID_HOME,ANDROID_SDK_ROOT,JAVA_HOME,USE_LEGACY_PACKAGING \
            unshare --net -- bash -euc '
              ip link set lo up
              exec runuser -u "$1" -- env PATH="$4" "$2" ../tools/build_offline.dart build --platform android --flutter "$3"
            ' offline-build "$(id -un)" "$(command -v dart)" "$(command -v flutter)" "$PATH"
          cp "build/app/outputs/flutter-apk/app-$BUILD_FLAVOR-release.apk" linwood-flow-android-legacy.apk
      - name: Check universal APKs for 16 KB page support
        working-directory: .
        run: |
          dart run tools/check_android_page_sizes.dart \
            app/linwood-flow-android.apk app/linwood-flow-android-legacy.apk
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-build
          path: app/linwood-flow-android.apk
      - name: Archive (legacy)
        uses: actions/upload-artifact@v7
        with:
          name: apk-build-legacy
          path: app/linwood-flow-android-legacy.apk
      - name: Build split APKs
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor "$BUILD_FLAVOR"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-$BUILD_FLAVOR-release.apk" linwood-flow-android-arm.apk
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-$BUILD_FLAVOR-release.apk" linwood-flow-android-arm64.apk
          cp "build/app/outputs/flutter-apk/app-x86_64-$BUILD_FLAVOR-release.apk" linwood-flow-android-x86_64.apk
        env:
          USE_LEGACY_PACKAGING: 'false'
      - name: Build split APKs (legacy packaging)
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor "$BUILD_FLAVOR"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-$BUILD_FLAVOR-release.apk" linwood-flow-android-arm-legacy.apk
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-$BUILD_FLAVOR-release.apk" linwood-flow-android-arm64-legacy.apk
          cp "build/app/outputs/flutter-apk/app-x86_64-$BUILD_FLAVOR-release.apk" linwood-flow-android-x86_64-legacy.apk
        env:
          USE_LEGACY_PACKAGING: 'true'
      - name: Check split APKs for 16 KB page support
        working-directory: .
        run: |
          dart run tools/check_android_page_sizes.dart \
            app/linwood-flow-android-arm.apk app/linwood-flow-android-arm-legacy.apk \
            app/linwood-flow-android-arm64.apk app/linwood-flow-android-arm64-legacy.apk \
            app/linwood-flow-android-x86_64.apk app/linwood-flow-android-x86_64-legacy.apk
      - name: Build Play bundle
        run: flutter build appbundle -v --release --flavor "$BUILD_FLAVOR"
      - name: Check Play bundle for 16 KB page support
        working-directory: .
        run: |
          dart run tools/check_android_page_sizes.dart \
            "app/build/app/outputs/bundle/${BUILD_FLAVOR}Release/app-${BUILD_FLAVOR}-release.aab"
      - name: Analyze Android arm64 size
        run: |
          flutter build apk -v --release --flavor "$BUILD_FLAVOR" --target-platform android-arm64 --split-per-abi --analyze-size --code-size-directory=build/size-analysis/android-arm64
          cp "$HOME"/.flutter-devtools/apk-code-size-analysis_*.json build/size-analysis/android-arm64/
      - name: Archive size analysis
        uses: actions/upload-artifact@v7
        with:
          name: android-size-analysis
          path: app/build/size-analysis/
          if-no-files-found: error
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm-build
          path: app/linwood-flow-android-arm.apk
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-build
          path: app/linwood-flow-android-arm64.apk
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64-build
          path: app/linwood-flow-android-x86_64.apk
      - name: Archive (legacy arm)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm-build-legacy
          path: app/linwood-flow-android-arm-legacy.apk
      - name: Archive (legacy arm64)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-build-legacy
          path: app/linwood-flow-android-arm64-legacy.apk
      - name: Archive (legacy x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64-build-legacy
          path: app/linwood-flow-android-x86_64-legacy.apk
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: windows-2025
            name: x86_64
            dir: x64
          - image: windows-11-arm
            name: arm64
            dir: arm64
    runs-on: ${{ matrix.arch.image }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.symlinks true
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Make yq tool available on Windows runners
        run: |
          choco install yq
          choco install innosetup
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          # Use the pinned Git tag when no native ARM64 SDK archive exists.
          channel: ${{ runner.arch == 'ARM64' && runner.os != 'macOS' && 'master' || 'stable' }}
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/windows/pub-cache
      - name: ✅ Enable platforms
        run: flutter config --enable-windows-desktop
      - name: 📦 Get helper dependencies
        run: dart pub get -C ../tools --enforce-lockfile
      - name: 🎨 Apply native branding
        run: dart ../tools/apply_branding.dart ${{ env.BUILD_FLAVOR }} windows
      - name: 🏭 Build and prepare offline Windows dependencies
        run: dart ../tools/build_offline.dart prepare --platform windows --flavor ${{ env.BUILD_FLAVOR }}
      - name: 📊 Build offline and analyze Windows x86_64 size
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          dart ../tools/build_offline.dart build --platform windows --analyze-size --code-size-directory=build/size-analysis/windows-x86_64
          New-Item -ItemType Directory -Force build/size-analysis/windows-x86_64 | Out-Null
          Copy-Item "$env:USERPROFILE/.flutter-devtools/*-code-size-analysis_*.json" build/size-analysis/windows-x86_64/
      - name: 🏭 Build Windows ARM64 offline
        if: ${{ matrix.arch.name == 'arm64' }}
        run: dart ../tools/build_offline.dart build --platform windows
      - name: Build setup
        shell: pwsh
        run: |
          Get-Content pubspec.yaml | Select-String -Pattern 'version:\s(.+)\+'  | % {Set-Item -Path Env:FLOW_VERSION -Value "$($_.matches.groups[1])"}
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /DMyAppVersion=$Env:FLOW_VERSION /DMyAppArch=${{ matrix.arch.dir }} /DMyAppFlavor=${{ env.BUILD_FLAVOR }} FlowSetup.iss
      - name: Copy portable start script
        run: |
          cp scripts/start.bat build/windows/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/runner/Release/
          cp build/windows/${{ matrix.arch.dir }}/linwood-flow-windows-setup.exe linwood-flow-windows-setup-${{ matrix.arch.name }}.exe
          dart ../tools/reproducible.dart "build/windows/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/runner/Release" linwood-flow-windows-${{ matrix.arch.name }}.zip
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch.name }}-build
          path: |
            app/linwood-flow-windows-${{ matrix.arch.name }}.zip
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch.name }}-setup
          path: |
            app/linwood-flow-windows-setup-${{ matrix.arch.name }}.exe
      - name: Archive size analysis
        if: ${{ matrix.arch.name == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-size-analysis
          path: app/build/size-analysis/windows-x86_64/
          if-no-files-found: error
  build-msix:
    name: build-msix
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.symlinks true
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/windows/pub-cache
      - name: 📦 Get helper dependencies
        run: dart pub get -C ../tools --enforce-lockfile
      - name: 🎨 Apply native branding
        run: dart ../tools/apply_branding.dart ${{ env.BUILD_FLAVOR }} windows
      - name: 🏭 Build MSIX
        shell: pwsh
        run: |
          dart ../tools/build_offline.dart prepare --platform windows --flavor $env:BUILD_FLAVOR
          dart ../tools/build_offline.dart build --platform windows
          New-Item -ItemType Directory -Force build/windows/x64/runner | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/${{ env.BUILD_FLAVOR }}/runner/Release build/windows/x64/runner/
          dart run msix:create --build-windows=false
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: msix-build
          path: app/build/windows/x64/runner/Release/flow.msix
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: ubuntu-24.04
            name: x86_64
            dir: x64
            appimage: x86_64
            gdk_pixbuf_dev: libgdk-pixbuf2.0-dev
          - image: ubuntu-24.04-arm
            name: arm64
            dir: arm64
            appimage: aarch64
            gdk_pixbuf_dev: libgdk-pixbuf2.0-dev
    runs-on: ${{ matrix.arch.image }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip \
            python3-setuptools \
            desktop-file-utils \
            ${{ matrix.arch.gdk_pixbuf_dev }} \
            fakeroot \
            strace \
            fuse \
            libgtk-3-dev \
            libx11-dev \
            pkg-config \
            cmake \
            ninja-build \
            libblkid-dev \
            liblzma-dev \
            clang \
            dpkg-dev \
            patchelf \
            alien \
            libsecret-1-dev \
            libjsoncpp-dev \
            rpm
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          # Use the pinned Git tag when no native ARM64 SDK archive exists.
          channel: ${{ runner.arch == 'ARM64' && runner.os != 'macOS' && 'master' || 'stable' }}
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/linux/pub-cache
      - name: ✅ Enable platforms
        run: |
          rm -f "$(dirname "$(dirname "$(command -v flutter)")")/engine/src/.gn"
          flutter config --enable-linux-desktop
      - name: 📦 Get helper dependencies
        run: dart pub get -C ../tools --enforce-lockfile
      - name: 🎨 Apply native branding
        run: dart ../tools/apply_branding.dart ${{ env.BUILD_FLAVOR }} linux
      - name: 🏭 Build and prepare offline Linux dependencies
        run: dart ../tools/build_offline.dart prepare --platform linux --flavor "$BUILD_FLAVOR"
      - name: 📊 Build without network access and analyze Linux x86_64 size
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$4" "$2" ../tools/build_offline.dart build --platform linux --flutter "$3" \
              --analyze-size --code-size-directory=build/size-analysis/linux-x86_64
          ' offline-build "$(id -un)" "$(command -v dart)" "$(command -v flutter)" "$PATH"
          cp "$HOME"/.flutter-devtools/*-code-size-analysis_*.json build/size-analysis/linux-x86_64/
      - name: 🏭 Build Linux ARM64 without network access
        if: ${{ matrix.arch.name == 'arm64' }}
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$4" "$2" ../tools/build_offline.dart build --platform linux --flutter "$3"
          ' offline-build "$(id -un)" "$(command -v dart)" "$(command -v flutter)" "$PATH"
      - name: 🏭 Make binary executable
        run: |
          chmod +x build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/flow
      - name: Update files to arm64
        if: ${{ matrix.arch.dir == 'arm64' }}
        run: |
          sed -i 's/^Architecture: amd64/Architecture: arm64/' linux/debian/DEBIAN/control
      - name: Build .deb executable
        run: |
          cp -fr build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle linux/debian/usr/bin
          dpkg-deb --build --root-owner-group linux/debian
          cp linux/*.deb linwood-flow-linux-${{ matrix.arch.name }}.deb
      - name: Build .rpm executable
        run: |
          bash scripts/build-rpm.sh -d ${{ matrix.arch.dir }} -b ${{ matrix.arch.name }} -f ${{ env.BUILD_FLAVOR }}
      - name: Build .AppImage executable
        run: |
          wget -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch.appimage }}.AppImage
          chmod +x appimagetool.AppImage
          # Build AppDir
          mkdir -p AppDir/usr/bin
          # move bundle folder to AppDir
          cp build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/* AppDir/usr/bin/ -r
          mkdir -p AppDir/usr/share/icons/hicolor
          cp linux/debian/usr/share/icons/hicolor AppDir/usr/share/icons/ -r
          mkdir -p AppDir/usr/share/metainfo/
          cp linux/debian/usr/share/metainfo/dev.linwood.flow.appdata.xml AppDir/usr/share/metainfo/
          mkdir -p AppDir/usr/share/applications/
          cp linux/debian/usr/share/applications/dev.linwood.flow.desktop AppDir/usr/share/applications/
          ln -s usr/share/applications/dev.linwood.flow.desktop AppDir/dev.linwood.flow.desktop
          ln -s usr/bin/flow AppDir/AppRun
          ln -s usr/share/icons/hicolor/256x256/apps/dev.linwood.flow.png AppDir/dev.linwood.flow.png
          # Build AppImage
          UPDATE_INFO="gh-releases-zsync|LinwoodDev|Flow|stable|linwood-flow-linux-${{ matrix.arch.name }}.AppImage.zsync"
          if [[ "${{ env.BUILD_FLAVOR }}" == "nightly" ]]; then
            UPDATE_INFO="gh-releases-zsync|LinwoodDev|Flow|nightly|linwood-flow-linux-${{ matrix.arch.name }}.AppImage.zsync"
          fi
          ./appimagetool.AppImage -u "$UPDATE_INFO" AppDir linwood-flow-linux-${{ matrix.arch.name }}.AppImage
      - name: Copy nessessary files
        run: |
          BRANDING_LOGO=images/logo.png
          if [[ "${{ env.BUILD_FLAVOR }}" == "nightly" ]]; then BRANDING_LOGO=images/nightly.png; fi
          cp "$BRANDING_LOGO" build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/dev.linwood.flow.png
          mkdir -p build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/usr/share
          cp -r linux/debian/usr/share build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/usr
      - name: Copy portable start script
        run: |
          chmod +x scripts/start.sh
          cp scripts/start.sh build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle
          dart ../tools/reproducible.dart "build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle" linwood-flow-linux-${{ matrix.arch.name }}.tar.gz
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-build
          path: |
            app/linwood-flow-linux-${{ matrix.arch.name }}.tar.gz
      - name: Archive .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-deb
          path: |
            app/linwood-flow-linux-${{ matrix.arch.name }}.deb
      - name: Archive .rpm
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-rpm
          path: |
            app/build/linwood-flow-linux-${{ matrix.arch.name }}.rpm
      - name: Archive .AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-appimage
          path: |
            app/linwood-flow-linux-${{ matrix.arch.name }}.AppImage
            app/linwood-flow-linux-${{ matrix.arch.name }}.AppImage.zsync
      - name: Archive size analysis
        if: ${{ matrix.arch.name == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-size-analysis
          path: app/build/size-analysis/linux-x86_64/
          if-no-files-found: error
  build-snap:
    name: build-snap
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: ubuntu-24.04
            name: x86_64
            dir: x64
            appimage: x86_64
          - image: ubuntu-24.04-arm
            name: arm64
            dir: arm64
            appimage: aarch64
    runs-on: ${{ matrix.arch.image }}
    timeout-minutes: 90
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Add snapcraft directory
        run: |
          mkdir -p snap
          cp app/snapcraft.yaml snap/snapcraft.yaml
      - name: Select Snap build flavor
        run: |
          sed -i "s/BUILD_FLAVOR=production/BUILD_FLAVOR=${{ env.BUILD_FLAVOR }}/" snap/snapcraft.yaml
          if [[ "${{ env.BUILD_FLAVOR }}" == "nightly" ]]; then
            sed -i "s/title: 'Linwood Flow'/title: 'Linwood Flow Nightly'/" snap/snapcraft.yaml
          fi
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        continue-on-error: true
        name: Publish Snap to Store
        if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/tags/nightly' || github.ref == 'refs/tags/stable' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.ref == 'refs/heads/develop' && 'edge' || github.ref == 'refs/heads/main' && 'candidate' || github.ref == 'refs/tags/nightly' && 'beta' || 'stable' }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-snap
          path: ${{ steps.build.outputs.snap }}
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/macos/pub-cache
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ✅ Enable platforms
        run: flutter config --enable-macos-desktop
      - name: 📦 Get helper dependencies
        run: dart pub get -C ../tools --enforce-lockfile
      - name: 🎨 Apply native branding
        run: dart ../tools/apply_branding.dart ${{ env.BUILD_FLAVOR }} macos
      - name: 🏭 Build and prepare offline macOS dependencies
        run: dart ../tools/build_offline.dart prepare --platform macos --flavor "$BUILD_FLAVOR"
      - name: 🏭 Build macOS offline
        run: dart ../tools/build_offline.dart build --platform macos
      - name: Zip file
        run: dart ../tools/reproducible.dart build/macos/Build/Products/Release/flow.app build/macos/Build/Products/Release/linwood-flow-macos.zip flow.app
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install appdmg
        run: |
          python3 -m pip install setuptools
          npm install -g appdmg
      - name: Create dmg
        run: |
          appdmg DmgSetup.json linwood-flow-macos.dmg
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            app/build/macos/Build/Products/Release/linwood-flow-macos.zip
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            app/linwood-flow-macos.dmg

  build-ipa:
    name: build-ipa (iOS)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
          pub-cache-path: ${{ github.workspace }}/.offline-build/ios/pub-cache
      - name: 📦 Get helper dependencies
        run: dart pub get -C ../tools --enforce-lockfile
      - name: 🎨 Apply native branding
        run: dart ../tools/apply_branding.dart ${{ env.BUILD_FLAVOR }} ios
      - name: 🏭 Build and prepare offline iOS dependencies
        run: dart ../tools/build_offline.dart prepare --platform ios --flavor "$BUILD_FLAVOR"
      - name: 🏭 Build iOS offline
        run: dart ../tools/build_offline.dart build --platform ios
      - name: Packing IPA
        run: |
          dart ../tools/reproducible.dart build/ios/iphoneos/Runner.app build/ios/iphoneos/linwood-flow-ios.ipa Payload/Runner.app
      #          ls -l linwood-flow-ios.ipa
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: ipa-build
          path: app/build/ios/iphoneos/linwood-flow-ios.ipa
          compression-level: 0 #ipa is already compressed
  build-docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set Docker tag
        id: docker_tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "tag=dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_REF}" == "refs/tags/stable" || "${GITHUB_REF}" == "refs/tags/nightly" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=unknown" >> $GITHUB_ENV
          fi
      - name: Log Docker tag
        run: echo "Docker tag is ${{ env.tag }}"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: ${{ env.tag != 'unknown' }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: linwooddev/flow:${{ env.tag }}
          build-args: |
            BUILD_FLAVOR=${{ env.BUILD_FLAVOR }}
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.setup.outputs.FLOW_VERSION }}
      build_number: ${{ steps.setup.outputs.FLOW_BUILD_NUMBER }}
    needs:
      - build-apk
      - build-windows
      - build-linux
      - build-macos
      - build-ipa
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
        env:
          CI_PAT: ${{ secrets.CI_PAT }}
        with:
          token: ${{ env.CI_PAT }}
      - name: Setup git
        id: setup
        run: |
          FLOW_VERSION_REGEX="version:\s(.+)\+(.+)"
          [[ $(grep -E "${FLOW_VERSION_REGEX}" app/pubspec.yaml) =~ ${FLOW_VERSION_REGEX} ]]
          FLOW_VERSION="${BASH_REMATCH[1]}"
          echo "FLOW_VERSION=${FLOW_VERSION}" >> $GITHUB_ENV
          echo "FLOW_VERSION=${FLOW_VERSION}" >> $GITHUB_OUTPUT
          FLOW_BUILD_NUMBER="${BASH_REMATCH[2]}"
          echo "FLOW_BUILD_NUMBER=${FLOW_BUILD_NUMBER}" >> $GITHUB_ENV
          echo "FLOW_BUILD_NUMBER=${FLOW_BUILD_NUMBER}" >> $GITHUB_OUTPUT
          git config --global user.email "ci@linwood.dev"
          git config --global user.name "Linwood CI"
      - uses: actions/download-artifact@v8
        with:
          name: apk-build-legacy
      - uses: actions/download-artifact@v8
        with:
          name: apk-build
      - uses: actions/download-artifact@v8
        with:
          name: apk-arm-build
      - uses: actions/download-artifact@v8
        with:
          name: apk-arm64-build
      - uses: actions/download-artifact@v8
        with:
          name: apk-x86_64-build
      - uses: actions/download-artifact@v8
        with:
          name: apk-arm-build-legacy
      - uses: actions/download-artifact@v8
        with:
          name: apk-arm64-build-legacy
      - uses: actions/download-artifact@v8
        with:
          name: apk-x86_64-build-legacy
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-build
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64-build
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-build
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-deb
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-rpm
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-appimage
      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-build
      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-deb
      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-rpm
      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-appimage
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64-setup
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-setup
      - uses: actions/download-artifact@v8
        with:
          name: macos-build
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
      - uses: actions/download-artifact@v8
        with:
          name: ipa-build
      - name: Configure git
        if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
        run: |
          git --version
          git config --global user.email "actions@github.com"
          git config --global user.name "Actions"
          git pull --tags
      - name: Add checksums
        run: |
          output_file="checksums.txt"

          # Empty the output file if it exists
          > "$output_file"

          # Find and loop through all files starting with "linwood-flow" in the current directory
          for file in linwood-flow*; do
            # Check if the file exists (in case no matches were found)
            if [ -f "$file" ]; then
              # Append sha256sum to the output file in the format "hash  filename"
              sha256sum "$file" >> "$output_file"
            fi
          done

          echo "SHA256 hashes for files starting with 'linwood-flow' saved to $output_file"
      - name: 🚀 Deploy stable
        if: ${{ env.BUILD_FLAVOR == 'production' && (github.ref == 'refs/tags/stable' || github.event_name == 'release') }}
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          prerelease: true
          tag_name: stable
          files: |
            linwood-flow-windows-setup-x86_64.exe
            linwood-flow-windows-x86_64.zip
            linwood-flow-windows-setup-arm64.exe
            linwood-flow-windows-arm64.zip
            linwood-flow-linux-x86_64.tar.gz
            linwood-flow-linux-x86_64.deb
            linwood-flow-linux-x86_64.rpm
            linwood-flow-linux-x86_64.AppImage
            linwood-flow-linux-x86_64.AppImage.zsync
            linwood-flow-linux-arm64.tar.gz
            linwood-flow-linux-arm64.deb
            linwood-flow-linux-arm64.rpm
            linwood-flow-linux-arm64.AppImage
            linwood-flow-linux-arm64.AppImage.zsync
            linwood-flow-macos.zip
            linwood-flow-macos.dmg
            linwood-flow-android.apk
            linwood-flow-android-arm.apk
            linwood-flow-android-arm64.apk
            linwood-flow-android-x86_64.apk
            linwood-flow-android-legacy.apk
            linwood-flow-android-arm-legacy.apk
            linwood-flow-android-arm64-legacy.apk
            linwood-flow-android-x86_64-legacy.apk
            linwood-flow-ios.ipa
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Deploy nightly
        if: ${{ github.ref == 'refs/tags/nightly' }}
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          prerelease: true
          tag_name: nightly
          files: |
            linwood-flow-windows-setup-x86_64.exe
            linwood-flow-windows-x86_64.zip
            linwood-flow-windows-setup-arm64.exe
            linwood-flow-windows-arm64.zip
            linwood-flow-linux-x86_64.tar.gz
            linwood-flow-linux-x86_64.deb
            linwood-flow-linux-x86_64.rpm
            linwood-flow-linux-x86_64.AppImage
            linwood-flow-linux-x86_64.AppImage.zsync
            linwood-flow-linux-arm64.tar.gz
            linwood-flow-linux-arm64.deb
            linwood-flow-linux-arm64.rpm
            linwood-flow-linux-arm64.AppImage
            linwood-flow-linux-arm64.AppImage.zsync
            linwood-flow-macos.zip
            linwood-flow-macos.dmg
            linwood-flow-android.apk
            linwood-flow-android-arm.apk
            linwood-flow-android-arm64.apk
            linwood-flow-android-x86_64.apk
            linwood-flow-android-legacy.apk
            linwood-flow-android-arm-legacy.apk
            linwood-flow-android-arm64-legacy.apk
            linwood-flow-android-x86_64-legacy.apk
            linwood-flow-ios.ipa
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            linwood-flow-windows-setup-x86_64.exe
            linwood-flow-windows-x86_64.zip
            linwood-flow-windows-setup-arm64.exe
            linwood-flow-windows-arm64.zip
            linwood-flow-linux-x86_64.tar.gz
            linwood-flow-linux-x86_64.deb
            linwood-flow-linux-x86_64.rpm
            linwood-flow-linux-x86_64.AppImage
            linwood-flow-linux-x86_64.AppImage.zsync
            linwood-flow-linux-arm64.tar.gz
            linwood-flow-linux-arm64.deb
            linwood-flow-linux-arm64.rpm
            linwood-flow-linux-arm64.AppImage
            linwood-flow-linux-arm64.AppImage.zsync
            linwood-flow-macos.zip
            linwood-flow-macos.dmg
            linwood-flow-android.apk
            linwood-flow-android-arm.apk
            linwood-flow-android-arm64.apk
            linwood-flow-android-x86_64.apk
            linwood-flow-android-legacy.apk
            linwood-flow-android-arm-legacy.apk
            linwood-flow-android-arm64-legacy.apk
            linwood-flow-android-x86_64-legacy.apk
            linwood-flow-ios.ipa
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy-to-play-store:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: app
    env:
      PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_PAT }}
      - name: Set source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Setup git
        run: |
          git config --global user.email "ci@linwood.dev"
          git config --global user.name "Linwood CI"
      - name: Import files
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        if: ${{ env.PLAY_STORE_CREDENTIALS != '' }}
        run: |
          cd android
          if [[ -n "$KEY_PROPERTIES" ]] ; then echo "$KEY_PROPERTIES" | base64 --decode > key.properties  ; fi
          if [[ -n "$KEY_JKS" ]] ; then echo "$KEY_JKS" | base64 --decode > key.jks  ; fi
          echo "$PLAY_STORE_CREDENTIALS" | base64 --decode > play-store-credentials.json
      - name: 🔧 Setup java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: 📦 Get dependencies
        run: |
          flutter pub get
          flutter doctor -v
      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: app/android
      - name: 🚀 Deploy to Play Store
        if: ${{ github.ref == 'refs/tags/stable' && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: bundle exec fastlane deploy
        working-directory: app/android
      - name: 🚀 Deploy to Play Store
        if: ${{ github.ref == 'refs/tags/nightly' && env.PLAY_STORE_CREDENTIALS != '' }}
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: bundle exec fastlane beta
        working-directory: app/android
  publish-winget:
    needs: [deploy]
    if: ${{ github.ref == 'refs/tags/stable' || github.ref == 'refs/tags/nightly' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_PAT }}
      - if: ${{ github.ref == 'refs/tags/stable' }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: LinwoodDev.Flow
          version: ${{ needs.deploy.outputs.version }}
          release-tag: v${{ needs.deploy.outputs.version }}
          token: ${{ secrets.CI_PAT }}
      - if: ${{ github.ref == 'refs/tags/nightly' }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: LinwoodDev.Flow.Nightly
          version: ${{ needs.deploy.outputs.version }}
          release-tag: v${{ needs.deploy.outputs.version }}
          token: ${{ secrets.CI_PAT }}
