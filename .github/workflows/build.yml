      - name: Archive old portable
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch.name }}-alternative-build
          path: app/build/linux/${{ matrix.arch.dir }}/release/bundle
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.20.0
        with:
          flutter-version-file: app/pubspec.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ✅ Enable platforms
        run: flutter config --enable-macos-desktop
      - name: 📦 Get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
      - name: 🏭 Build
        run: |
          flutter build macos -v --release
      - name: Zip file
        working-directory: app/build/macos/Build/Products/Release
        run: zip --symlinks -qr linwood-flow-macos.zip flow.app
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install appdmg
        run: |
          python3 -m pip install setuptools
          npm install -g appdmg
      - name: Create dmg
        run: |
          appdmg DmgSetup.json linwood-flow-macos.dmg
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            app/build/macos/Build/Products/Release/linwood-flow-macos.zip
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            app/linwood-flow-macos.dmg

  build-ipa:
    name: build-ipa (iOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.20.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: 📦 Get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
      - name: 🏭 Build
        run: |
          flutter build ios --release --no-codesign -v
      - name: Packing IPA
        run: |
          cd build/ios/iphoneos/
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          rm -f linwood-flow-ios.ipa
          zip -vr linwood-flow-ios.ipa Payload/
      #          ls -l linwood-flow-ios.ipa
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build
          path: app/build/ios/iphoneos/linwood-flow-ios.ipa
          compression-level: 0 #ipa is already compressed

