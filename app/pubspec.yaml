name: flow
description: Linwood Flow is a feature rich event and time management system

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.8.0+17

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  http: ^1.6.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  flow_api:
    path: ../api
  settings_leap:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: dcccf14111b0305bd1c5051a0e5ae0ed78af4439
      path: packages/settings_leap
  material_leap:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 9a60fef2b9d415beb31ba22c24bbea6c69b4c76f
      path: packages/material_leap
  path: ^1.9.1
  go_router: ^18.0.2
  flex_color_scheme: ^9.0.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  window_manager: ^0.5.2
  package_info_plus: ^10.2.2
  # Database
  sqflite_common: ^2.5.13
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  sqlite3: ^3.7.0
  dynamic_color: ^2.1.0
  flutter_localized_locales: ^2.0.5
  xml: ^7.1.0
  connectivity_plus: ^7.3.2
  rxdart: ^0.28.0
  flutter_secure_storage: ^11.2.0
  markdown_widget: ^2.3.2+8
  markdown: ^7.3.1
  args: ^2.7.0
  flutter_native_splash: ^2.4.8
  dart_mappable: ^4.10.0
  lw_sysapi:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: dcccf14111b0305bd1c5051a0e5ae0ed78af4439
      path: packages/lw_sysapi
  equatable: ^2.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  file_picker: ^13.1.0
  device_calendar_plus: ^0.10.0
  phosphor_flutter:
    git:
      url: https://github.com/CodeDoctorDE/phosphor-flutter.git
      ref: 571650ac818f95a6c1f48f1bf3d33a010505d2c9
  material_ui: ^1.5.0
  cupertino_icons: ^2.0.0
dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.1
  flutter_test:
    sdk: flutter
  dart_mappable_builder: ^4.10.0
  msix: ^3.18.0
dependency_overrides:
  # Linux notifications still constrain dbus to 0.7. Its runtime API is
  # compatible with 0.8; the breaking change is in generated return values.
  # Remove this when flutter_local_notifications_linux supports dbus 0.8.
  dbus: ^0.8.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - images/
    - data/
  fonts:
    - family: Comfortaa
      fonts:
        - asset: fonts/Comfortaa-Variable.ttf
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Variable.ttf
        - asset: fonts/Roboto-Italic-Variable.ttf
          style: italic
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
msix_config:
  display_name: Linwood Flow
  publisher_display_name: Linwood Development
  identity_name: LinwoodDevelopment.linwood-flow
  logo_path: images/logo.png
  capabilities: documentsLibrary
  languages: en-us, af, ar, ca, cs, da, de, el, es, fi, fr, he, hi, hu, it, ja, ko, nl, no, pl, pt-br, pt, ro, ru, sr, sv, th, tr, uk, vi, zh-Hans, zh-Hant
  install_certificate: false
